[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.1.0"
description = "Food delivery recommendation lab: synthetic Barcelona + Madrid data, retrieval and ranking algorithms, metrics and costs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7",
  "psycopg[binary]>=3.2", "psycopg-pool>=3.2",
  "google-genai>=1.0", "truststore>=0.9",
  "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scipy>=1.12",
  "lightgbm>=4.3", "torch>=2.2", "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["recsys", "recsys.synth", "recsys.store", "recsys.api", "recsys.models", "recsys.eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
