[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "0.1.0"
description = "Food delivery recommendation lab: synthetic Barcelona + Madrid data, retrieval and ranking algorithms, metrics and costs"
requires-python = ">=3.11"
# Core runtime: everything the web app needs to SERVE (baselines + the live LightGBM two-stage
# pipeline). Deliberately excludes torch so the cloud image stays small; torch is only used to
# TRAIN the neural rankers (DCNv2, two-tower), which are an offline/local concern (see `neural`).
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7",
  "psycopg[binary]>=3.2", "psycopg-pool>=3.2",
  "google-genai>=1.0", "truststore>=0.9",
  "numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scipy>=1.12",
  "lightgbm>=4.3", "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
# Neural rankers (DCNv2, two-tower) for offline training/eval only — not needed to serve.
neural = ["torch>=2.2"]
# Convenience: the full local experience (build the world, train everything, run tests).
full = ["recsys[test,neural]"]

# Discover packages automatically so the list can't drift from the tree (a stale entry like a
# non-existent recsys.models breaks a clean `pip install .`, even though editable installs tolerate it).
[tool.setuptools.packages.find]
include = ["recsys*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
