<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Recs Lab — Sign in</title>
  <style>
    :root { color-scheme: dark; --bg:#121211; --surface:#1a1a19; --border:#33332f; --text:#f0efec;
            --text-2:#c3c2b7; --muted:#94938b; --accent:#3987e5; --bad:#e66767; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:28px;
            width:min(360px,92vw); box-shadow:0 6px 24px rgb(0 0 0 / 35%); }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:var(--text-2); margin:0 0 18px; font-size:13px; }
    label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
    input { width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border);
            background:var(--bg); color:var(--text); font:inherit; }
    input:focus { outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
    button { width:100%; margin-top:18px; padding:10px; border:0; border-radius:8px; background:var(--accent);
             color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .err { color:var(--bad); font-size:13px; margin-top:12px; min-height:18px; }
  </style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <h1>Food Recs Lab</h1>
    <p>Sign in to continue.</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="b">Sign in</button>
    <div class="err" id="e" role="alert"></div>
  </form>
  <script>
    const f = document.getElementById("f"), e = document.getElementById("e"), b = document.getElementById("b");
    f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      e.textContent = ""; b.disabled = true;
      try {
        const r = await fetch("/api/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value }),
        });
        if (r.ok) { location.replace("/"); return; }
        const d = await r.json().catch(() => ({}));
        e.textContent = d.detail || "Sign in failed.";
      } catch { e.textContent = "Could not reach the server."; }
      b.disabled = false;
    });
  </script>
</body>
</html>
